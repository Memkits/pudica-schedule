name: Upload

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: cos-upload-${{ github.repository }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}
  cancel-in-progress: false
  queue: max

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - name: Check out repository
      uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - name: Set up Node.js
      uses: actions/setup-node@v6.5.0
      with:
        node-version: 24
        package-manager-cache: false

    - name: Enable Corepack
      run: |
        corepack enable
        corepack prepare yarn@4.18.0 --activate
        yarn --version

    - name: Set up Calcit and Caps
      uses: calcit-lang/setup-calcit@v1.5.0
      with:
        deps-file: deps.cirru
        tools: calcit,caps
        caps-version: "0.1.1"

    - name: Resolve immutable dependencies
      run: |
        set -euo pipefail
        caps --ci --strict
        yarn install --immutable
        caps verify --toolchain

    - name: Validate Calcit snapshot and types
      run: |
        set -euo pipefail
        test -f calcit.cirru
        test -f deps.cirru
        test ! -e compact.cirru
        test ! -e package.cirru
        calcit calcit.cirru edit format
        git diff --exit-code -- calcit.cirru
        calcit calcit.cirru --check-only --all-defs
        calcit calcit.cirru --check-only --ns app.schema --ns app.updater --ns app.storage --summary-only
        calcit calcit.cirru fix --workflow strict --verify --format json | tee /tmp/calcit-strict.json
        jq -e '.data.workflow.status == "passed" and .diagnostics == []' /tmp/calcit-strict.json
        calcit calcit.cirru analyze weak-types --only deprecated-call --summary-only --format json | jq -e '.data.summary.calls == 0'

    - name: Select CDN asset path
      id: asset-path
      env:
        CDN_ORIGIN: https://cos-sh.tiye.me
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail
        if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
          asset_prefix="${GITHUB_REPOSITORY}/pr/${PR_NUMBER}/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/"
        elif [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
          asset_prefix="${GITHUB_REPOSITORY}/"
        else
          asset_prefix="${GITHUB_REPOSITORY}/branches/${GITHUB_REF_NAME}/"
        fi
        base_url="${CDN_ORIGIN}/${asset_prefix}"
        echo "VITE_BASE_URL=${base_url}" >> "$GITHUB_ENV"
        echo "prefix=${asset_prefix}" >> "$GITHUB_OUTPUT"
        echo "base-url=${base_url}" >> "$GITHUB_OUTPUT"

    - name: Build web assets with CDN URLs
      run: |
        set -euo pipefail
        yarn build
        node --test tests/*.test.mjs

    - name: Check COS credentials
      id: cos-credentials
      if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
      env:
        COS_BUCKET: ${{ secrets.COS_BUCKET }}
        COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
        COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
      run: |
        if [[ -n "$COS_BUCKET" && -n "$COS_SECRET_ID" && -n "$COS_SECRET_KEY" ]]; then
          echo "available=true" >> "$GITHUB_OUTPUT"
        else
          echo "available=false" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            echo "::warning title=COS upload skipped::Configure COS_BUCKET, COS_SECRET_ID, and COS_SECRET_KEY to run public upload verification."
          else
            echo "::error title=COS credentials missing::COS_BUCKET, COS_SECRET_ID, and COS_SECRET_KEY are required for production deployment."
            exit 1
          fi
        fi

    - name: Upload and verify static assets on COS
      if: steps.cos-credentials.outputs.available == 'true'
      timeout-minutes: 10
      uses: worktools/cos-upload-action@v1.2.0
      with:
        source-dir: dist
        bucket: ${{ secrets.COS_BUCKET }}
        region: ap-shanghai
        prefix: ${{ steps.asset-path.outputs.prefix }}
        public-base-url: ${{ steps.asset-path.outputs.base-url }}
        secret-id: ${{ secrets.COS_SECRET_ID }}
        secret-key: ${{ secrets.COS_SECRET_KEY }}

    - name: Upload web assets
      id: deploy
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: Pendect/action-rsyncer@v2.0.0
      env:
        DEPLOY_KEY: ${{ secrets.rsync_private_key }}
      with:
        flags: '-avzr --progress'
        options: ''
        ssh_options: ''
        src: 'dist/*'
        dest: 'rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}'

    - name: Display deploy status
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: echo "${{ steps.deploy.outputs.status }}"
